<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch from js</title>
    <script>
       
       
        const URL = "https://dummyjson.com/products";

async function loadProduct() {
    try {
        const res = await fetch(URL);
        const data = await res.json();

        const ele = document.getElementById("products");

        data.products.forEach((i) => {
            ele.innerHTML += `
            <tr>
                <td>${i.id}</td>
                <td>${i.title}</td>
                <td>${i.description}</td>
                <td>${i.price}</td>
                <td>${i.discountPercentage}</td>
                <td>${i.rating}</td>
                <td>${i.stock}</td>
                <td>${i.brand}</td>
                <td>${i.category}</td>
            </tr>
            `;
        });

    } catch (err) {
        console.log("Error:", err);
    }
}

loadProduct();
    </script>
</head>
<body>
    
</body>
</html>
